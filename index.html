<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FocusFlow</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--bg-elev:#12151d;--surface:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);--text:#e7e9ee;--text-muted:#8b90a0;--accent:#6366f1;--accent-2:#22d3ee;--success:#34d399;--danger:#f87171;--radius:16px}
[data-theme="light"]{--bg:#f4f5f9;--bg-elev:#fff;--surface:rgba(0,0,0,.03);--border:rgba(0,0,0,.08);--text:#12151d;--text-muted:#5b6070}
[data-theme="emerald"]{--bg:#061410;--bg-elev:#0a1f18;--surface:rgba(16,185,129,.05);--border:rgba(16,185,129,.15);--accent:#10b981;--accent-2:#34d399}
[data-theme="rose"]{--bg:#140810;--bg-elev:#1f0a18;--surface:rgba(244,63,94,.05);--border:rgba(244,63,94,.15);--accent:#f43f5e;--accent-2:#fb7185}
[data-theme="ocean"]{--bg:#0a1929;--bg-elev:#0f2135;--surface:rgba(34,211,238,.05);--border:rgba(34,211,238,.15);--text:#e0f2fe;--text-muted:#7dd3fc;--accent:#0891b2;--accent-2:#22d3ee}
[data-theme="sunset"]{--bg:#1a0d08;--bg-elev:#2a1510;--surface:rgba(251,146,60,.05);--border:rgba(251,146,60,.15);--text:#fef3c7;--text-muted:#fdba74;--accent:#f97316;--accent-2:#fbbf24}
[data-theme="forest"]{--bg:#0a1408;--bg-elev:#122210;--surface:rgba(34,197,94,.05);--border:rgba(34,197,94,.15);--text:#dcfce7;--text-muted:#86efac;--accent:#16a34a;--accent-2:#4ade80}
[data-theme="candy"]{--bg:#1a0a1a;--bg-elev:#2a1028;--surface:rgba(236,72,153,.05);--border:rgba(236,72,153,.15);--text:#fce7f3;--text-muted:#f9a8d4;--accent:#ec4899;--accent-2:#f472b6}
[data-theme="space"]{--bg:#05050f;--bg-elev:#0a0a1a;--surface:rgba(139,92,246,.05);--border:rgba(139,92,246,.2);--text:#e0e7ff;--text-muted:#a5b4fc;--accent:#8b5cf6;--accent-2:#c084fc}
[data-theme="tomato"]{--bg:#1a0505;--bg-elev:#2a0a0a;--surface:rgba(239,68,68,.05);--border:rgba(239,68,68,.2);--text:#fee2e2;--text-muted:#fca5a5;--accent:#ef4444;--accent-2:#f87171}
[data-theme="cat"]{--bg:#1a1210;--bg-elev:#2a2018;--surface:rgba(251,191,36,.05);--border:rgba(251,191,36,.15);--text:#fef3c7;--text-muted:#fcd34d;--accent:#f59e0b;--accent-2:#fbbf24}
[data-theme="rainbow"]{--bg:#0f0a1a;--bg-elev:#1a102a;--surface:rgba(255,255,255,.04);--border:rgba(255,255,255,.1);--text:#fff;--text-muted:#d1d5db;--accent:#ff6b6b;--accent-2:#4ecdc4}
[data-theme="gold"]{--bg:#0f0a03;--bg-elev:#1a1208;--surface:rgba(251,191,36,.08);--border:rgba(251,191,36,.3);--text:#fef3c7;--text-muted:#fcd34d;--accent:#f59e0b;--accent-2:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:radial-gradient(circle at 50% -20%,rgba(99,102,241,.15),transparent 60%),var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);background:rgba(11,13,18,.8);border-bottom:1px solid var(--border);flex-wrap:wrap}
[data-theme="light"] header{background:rgba(244,245,249,.8)}
[data-theme="emerald"] header{background:rgba(6,20,16,.8)}
[data-theme="rose"] header{background:rgba(20,8,16,.8)}
[data-theme="ocean"] header{background:rgba(10,25,41,.8)}
[data-theme="sunset"] header{background:rgba(26,13,8,.8)}
[data-theme="forest"] header{background:rgba(10,20,8,.8)}
[data-theme="candy"] header{background:rgba(26,10,26,.8)}
[data-theme="space"] header{background:rgba(5,5,15,.8)}
[data-theme="tomato"] header{background:rgba(26,5,5,.8)}
[data-theme="cat"] header{background:rgba(26,18,16,.8)}
[data-theme="rainbow"] header{background:rgba(15,10,26,.8)}
[data-theme="gold"] header{background:rgba(15,10,3,.8)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;margin-right:auto}
.logo-mark{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.icon-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-size:1rem}
.wallet-badge{display:flex;align-items:center;gap:4px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);padding:4px 8px;border-radius:16px;font-weight:700;font-size:.9rem;color:#fbbf24}
.app{display:flex;flex-direction:column;gap:16px;padding:16px;max-width:600px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.timer-card{display:flex;flex-direction:column;align-items:center;gap:16px}
.ring-wrap{position:relative;width:100%;max-width:280px;aspect-ratio:1}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.05);stroke-width:8}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .3s ease}
.timer-time{position:absolute;inset:0;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(3rem,15vw,4.5rem);letter-spacing:-.03em}
.timer-phase{position:absolute;bottom:20%;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.timer-actions{display:flex;gap:10px;width:100%;justify-content:center}
.btn{border:none;border-radius:12px;padding:12px 20px;font-weight:600;background:var(--surface);color:var(--text);border:1px solid var(--border);flex:1;text-align:center}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:none}
.habit-select{background:var(--bg-elev);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;font:inherit;width:100%;text-align:center}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.section-title h2{font-size:1rem;margin:0}
.habit-grid{display:flex;flex-direction:column;gap:10px}
.habit{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}
.habit-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:1.2rem;flex:none}
.habit-info{flex:1;min-width:0}
.habit-name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-meta{font-size:.75rem;color:var(--text-muted);margin-top:2px}
.color-picker-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;margin-bottom:8px}
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.2s}
.color-dot.active{border-color:#fff;transform:scale(1.1)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:100;padding:16px;opacity:0;pointer-events:none;transition:.2s}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;transform:translateY(20px);transition:.2s;margin:0 auto}
.modal-backdrop.open .modal{transform:translateY(0)}
.modal h3{margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:.85rem;color:var(--text-muted)}
.field input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:10px;font:inherit;width:100%}
.row{display:flex;gap:10px;width:100%}
.row input{flex:1;min-width:0}
.row button{flex:0 0 auto;padding-left:15px;padding-right:15px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;width:100%}
.modal-actions .btn{flex:1}
.shop-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.shop-tab{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:20px;font-size:.8rem;cursor:pointer}
.shop-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shop-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.shop-item-icon{font-size:1.8rem}
.shop-item-name{font-weight:600;font-size:.85rem}
.shop-item-desc{font-size:.7rem;color:var(--text-muted);line-height:1.1}
.shop-item-price{display:inline-block;background:rgba(251,191,36,.15);color:#fbbf24;padding:4px 8px;border-radius:10px;font-weight:700;font-size:.8rem;margin:0 auto}
.shop-item button{padding:8px;font-size:.85rem;width:100%}
.quest-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.quest-info{flex:1}
.quest-title{font-weight:600;font-size:0.9rem;margin-bottom:4px}
.quest-progress-text{font-size:0.75rem;color:var(--text-muted)}
.quest-actions{display:flex;flex-direction:column;gap:4px}
.quest-actions button{padding:6px 10px;font-size:0.75rem;border-radius:8px;flex:none;width:auto}
.btn-skip{background:var(--surface);border:1px solid var(--border);color:var(--text-muted)}
.btn-skip:disabled{opacity:0.5;cursor:not-allowed}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:12px;z-index:200;transition:transform .3s ease;font-size:.9rem;color:var(--text)}
.toast.show{transform:translateX(-50%) translateY(0)}
.wheel-container{position:relative;width:260px;height:260px;margin:20px auto;display:flex;justify-content:center;align-items:center}
.wheel-pointer{position:absolute;top:-20px;font-size:2.5rem;color:var(--danger);z-index:10;text-shadow:0 2px 5px rgba(0,0,0,.5)}
.wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--bg-elev);box-shadow:0 0 20px rgba(0,0,0,.6);position:relative;transition:transform 4s cubic-bezier(0.15, 0.85, 0.25, 1);background:conic-gradient(#6366f1 0 45deg, #22d3ee 45deg 90deg, #34d399 90deg 135deg, #f59e0b 135deg 180deg, #f43f5e 180deg 225deg, #a855f7 225deg 270deg, #14b8a6 270deg 315deg, #eab308 315deg 360deg);}
.wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:var(--bg-elev);border:4px solid var(--border);display:grid;place-items:center;font-weight:800;font-size:0.85rem;cursor:pointer;z-index:5;color:var(--accent);box-shadow:0 0 15px rgba(0,0,0,.8);transition:.2s;text-align:center;line-height:1.1}
.wheel-center:active{transform:translate(-50%,-50%) scale(0.95)}
@keyframes coinUp{to{transform:translateY(-60px);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.85}}
@keyframes ringPulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes fireFlicker{0%,100%{opacity:1}50%{opacity:.85}}
@keyframes rainbowShift{to{background-position:300% 0}}
@keyframes goldShine{to{background-position:200% 0}}
.skin-pulse .ring-fg{animation:ringPulse 2s ease-in-out infinite}
.skin-glow .ring-fg{filter:drop-shadow(0 0 8px var(--accent))}
.skin-dashed .ring-fg{stroke-dasharray:10 6}
.skin-rainbow .ring-fg{stroke:url(#rainbowGrad)}
.skin-fire .ring-fg{filter:drop-shadow(0 0 12px #f97316);animation:fireFlicker 1s infinite}
.frame-bronze .logo-mark{box-shadow:0 0 0 2px #cd7f32}
.frame-silver .logo-mark{box-shadow:0 0 0 2px #c0c0c0}
.frame-gold .logo-mark{box-shadow:0 0 0 2px #fbbf24, 0 0 12px #fbbf24}
.frame-diamond .logo-mark{box-shadow:0 0 0 2px #67e8f9, 0 0 16px #22d3ee}
.frame-fire .logo-mark{box-shadow:0 0 0 2px #f97316, 0 0 16px #f97316;animation:fireFlicker 1s infinite}
.frame-crown .logo-mark{box-shadow:0 0 0 3px #fbbf24, 0 0 20px #fbbf24;animation:goldShine 2s infinite}
</style>
</head>
<body>
<header>
<div class="logo"><div class="logo-mark"></div>FocusFlow</div>
<div class="wallet-badge"><span>🪙</span><span id="coinCount">0</span><span id="devBadge" hidden>♾️</span></div>
<button class="icon-btn" id="questsBtn">🎯</button>
<button class="icon-btn" id="wheelBtn">🎡</button>
<button class="icon-btn" id="statsBtn">📊</button>
<button class="icon-btn" id="shopBtn">🛒</button>
<button class="icon-btn" id="settingsBtn">⚙️</button>
</header>
<div class="app">
<!-- ПИТОМЕЦ + СУНДУК -->
<div class="card" style="display:flex;gap:10px;align-items:center;justify-content:space-between;text-align:center;">
  <div style="flex:1;padding:10px;">
    <div id="pet" style="font-size:3rem;line-height:1;transition:transform .3s;cursor:pointer;user-select:none">🥚</div>
    <div id="petStatus" style="font-size:.75rem;color:var(--text-muted);margin-top:5px;">Сделай первый помидор!</div>
  </div>
  <div style="flex:1;">
    <button class="btn btn-primary" id="chestBtn" style="padding:10px;font-size:.85rem;width:100%;">🎁 Сундук</button>
    <div style="font-size:.7rem;color:var(--text-muted);margin-top:5px;" id="chestTimer">Готов к открытию!</div>
  </div>
</div>

<section class="card timer-card">
<div class="ring-wrap" id="ringWrap">
<svg viewBox="0 0 120 120">
<defs>
<linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--accent)"/><stop offset="100%" stop-color="var(--accent-2)"/></linearGradient>
<linearGradient id="rainbowGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#ff6b6b"/><stop offset="25%" stop-color="#feca57"/>
  <stop offset="50%" stop-color="#48dbfb"/><stop offset="75%" stop-color="#ff9ff3"/>
  <stop offset="100%" stop-color="#54a0ff"/>
</linearGradient>
</defs>
<circle class="ring-bg" cx="60" cy="60" r="54"/><circle class="ring-fg" id="ringFg" cx="60" cy="60" r="54" stroke-dasharray="339.292" stroke-dashoffset="0"/>
</svg>
<div class="timer-time" id="timerTime">25:00</div><div class="timer-phase" id="timerPhase">focus</div>
</div>
<select class="habit-select" id="habitSelect"><option value="">— выбери привычку —</option></select>
<div class="timer-actions"><button class="btn btn-primary" id="startBtn">Старт</button><button class="btn" id="pauseBtn" hidden>Пауза</button><button class="btn" id="skipBtn">Пропуск</button></div>
</section>
<section class="card">
<div class="section-title"><h2>Привычки</h2><button class="btn" id="addHabitBtn" style="flex:none;padding:8px 12px;font-size:.85rem">+ Добавить</button></div>
<div class="habit-grid" id="habitList"></div>
</section>
</div>

<div class="modal-backdrop" id="modal">
<div class="modal">
<h3>Новая привычка</h3>
<div class="field"><label>Название</label><input id="hName" placeholder="Читать 30 минут" maxlength="40"></div>
<div class="row">
<div class="field"><label>Иконка</label><input id="hIcon" value="📚" maxlength="4"></div>
<div class="field"><label>Цвет</label>
<div class="color-picker-row">
<div class="color-dot active" style="background:#6366f1" data-color="#6366f1"></div>
<div class="color-dot" style="background:#22d3ee" data-color="#22d3ee"></div>
<div class="color-dot" style="background:#34d399" data-color="#34d399"></div>
<div class="color-dot" style="background:#f59e0b" data-color="#f59e0b"></div>
<div class="color-dot" style="background:#f43f5e" data-color="#f43f5e"></div>
<div class="color-dot" style="background:#a855f7" data-color="#a855f7"></div>
</div>
<input type="hidden" id="hColor" value="#6366f1">
</div>
</div>
<div class="field"><label>Цель (помидоров в день)</label><input id="hTarget" type="number" min="1" max="20" value="1"></div>
<div class="modal-actions"><button class="btn" id="cancelBtn">Отмена</button><button class="btn btn-primary" id="saveHabitBtn">Сохранить</button></div>
</div>
</div>

<div class="modal-backdrop" id="settingsModal">
<div class="modal">
<h3>Настройки ⚙️</h3>
<div class="field"><label>Pomodoro (мин)</label><input id="sPomo" type="number" min="1" value="25"></div>
<div class="field"><label>Короткий перерыв (мин)</label><input id="sShort" type="number" step="0.1" min="0.1" value="5"></div>
<div class="field"><label>Длинный перерыв (мин)</label><input id="sLong" type="number" min="1" value="15"></div>
<hr style="border-color:var(--border);margin:12px 0">
<div class="field"><label>Промокод</label><div class="row"><input id="promoInput" placeholder="Введи код..."><button class="btn" id="applyPromoBtn">OK</button></div></div>
<div id="vipStatus" style="font-size:.85rem;color:var(--text-muted);margin-bottom:12px"></div>
<div class="row" style="margin-bottom:12px;">
<button class="btn" id="exportBtn">Экспорт 💾</button>
<button class="btn" id="importBtn">Импорт 📂</button>
<input type="file" id="importFile" accept=".json" style="display:none;">
</div>
<div class="modal-actions"><button class="btn" id="closeSettingsBtn">Закрыть</button><button class="btn btn-primary" id="saveSettingsBtn">Сохранить</button></div>
</div>
</div>

<div class="modal-backdrop" id="shopModal">
<div class="modal">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<h3 style="margin:0">🛒 Магазин</h3>
<div style="display:flex;align-items:center;gap:10px;">
<div class="shop-item-price">🪙 <span id="shopCoins">0</span></div>
<button id="topCloseShopBtn" style="background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer;">✕</button>
</div>
</div>
<div class="shop-tabs">
<button class="shop-tab active" data-tab="all">Все</button>
<button class="shop-tab" data-tab="theme">🎨 Темы</button>
<button class="shop-tab" data-tab="consumable">⚡ Бустеры</button>
<button class="shop-tab" data-tab="skin">✨ Скины</button>
<button class="shop-tab" data-tab="sound">🔔 Звуки</button>
<button class="shop-tab" data-tab="frame">🖼️ Рамки</button>
</div>
<div class="shop-grid" id="shopGrid"></div>
<div class="modal-actions" style="margin-top:16px"><button class="btn" id="closeShopBtn">Закрыть</button></div>
</div>
</div>

<div class="modal-backdrop" id="wheelModal">
<div class="modal" style="text-align:center;">
<h3>🎡 Колесо фортуны</h3>
<div class="wheel-container"><div class="wheel-pointer">▼</div><div class="wheel" id="wheel"></div><div class="wheel-center" id="spinBtn">Крутить</div></div>
<div class="modal-actions" style="margin-top:20px"><button class="btn" id="closeWheelBtn">Закрыть</button></div>
</div>
</div>

<div class="modal-backdrop" id="statsModal">
<div class="modal"><h3>📊 Статистика</h3><div id="statsContent"></div><div class="modal-actions"><button class="btn" id="closeStatsBtn">Закрыть</button></div></div>
</div>

<div class="modal-backdrop" id="questsModal">
<div class="modal"><h3>🎯 Квесты дня</h3><div id="questsContent"></div><div class="modal-actions"><button class="btn" onclick="document.getElementById('questsModal').classList.remove('open')">Закрыть</button></div></div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
// 1. ПЕРЕМЕННЫЕ
const tg = window.Telegram?.WebApp;
let tgHaptic = null;
const CHEST_CD = 4*3600*1000;
const todayStr=(d=new Date())=>{const z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2)+Date.now());
const KEY='focusflow_v1';

const defaultState=()=>({
  habits:[], sessions:[],
  settings:{pomodoroMin:25,shortBreakMin:5,longBreakMin:15,activeTheme:'dark',isVip:false,isDev:false,activeSkin:null,activeSound:'classic',activeFrame:null},

const storage=(()=>{
let state=load();const subs=new Set();
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return defaultState();const parsed=JSON.parse(raw);const safe={...defaultState(),...parsed,settings:{...defaultState().settings,...(parsed.settings||{})},wallet:{...defaultState().wallet,...(parsed.wallet||{})},timerState:{...defaultState().timerState,...(parsed.timerState||{})},daily:{...defaultState().daily,...(parsed.daily||{})},chest:{...defaultState().chest,...(parsed.chest||{})}};safe.habits=Array.isArray(safe.habits)?safe.habits:[];safe.sessions=Array.isArray(safe.sessions)?safe.sessions:[];return safe}catch(e){return defaultState()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}subs.forEach(cb=>cb(state))}
function get(){return state}
function subscribe(cb){subs.add(cb);cb(state);return()=>subs.delete(cb)}
function saveSilent(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
return{get,save,subscribe,saveSilent}})();

function haptic(type) {
  if (tgHaptic) {
    if (type === 'success') tgHaptic.notificationOccurred('success');
    else tgHaptic.impactOccurred('light');
  } else if (navigator.vibrate) {
    navigator.vibrate(type === 'success' ? [200, 100, 200] : 20);
  }
}

function spend(amount){const w=state().wallet;if(state().settings.isDev)return true;if(w.coins<amount)return false;w.coins-=amount;storage.save();return true}

const habits=(()=>{
const state=()=>storage.get();
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function add({name,icon,color,targetPerDay=1}){const s=state();s.habits.push({id:uid(),name:escapeHtml(name.trim()),icon:escapeHtml([...(icon||'🎯')].slice(0,4).join('')),color:/^#[0-9a-f]{6}$/i.test(color)?color:'#6366f1',targetPerDay:Math.max(1,+targetPerDay||1),createdAt:todayStr(),archived:false,freezeUsed:[]});storage.save()}
function archive(id){const h=state().habits.find(h=>h.id===id);if(h){h.archived=true;storage.save()}}
function list(){return state().habits.filter(h=>!h.archived)}
function byId(id){return state().habits.find(h=>h.id===id)}
function todayCount(id){const t=todayStr();return state().sessions.filter(s=>s.habitId===id&&s.date===t).length}
function addSession(habitId,durationMin){if(!habitId||!habits.byId(habitId))return;const s=state();s.sessions.push({id:uid(),habitId,date:todayStr(),durationMin,completedAt:Date.now()});storage.save()}
return{add,archive,list,byId,todayCount,addSession,escapeHtml}})();

const analytics=(()=>{
function getStreak(id){const habit=habits.byId(id);if(!habit)return 0;const counts={};storage.get().sessions.filter(s=>s.habitId===id).forEach(s=>counts[s.date]=(counts[s.date]||0)+1);let streak=0,cursor=new Date();if((counts[todayStr(cursor)]||0)<habit.targetPerDay){cursor.setDate(cursor.getDate()-1)}while(true){const key=todayStr(cursor);if((counts[key]||0)>=habit.targetPerDay||(habit.freezeUsed&&habit.freezeUsed.includes(key))){streak++;cursor.setDate(cursor.getDate()-1)}else break}return streak}
function getStats(){const s=storage.get().sessions;const total=s.length;const min=s.reduce((a,b)=>a+b.durationMin,0);const week={};for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const k=todayStr(d);week[k]=s.filter(x=>x.date===k).length}return{total,min,week}}
return{getStreak,getStats}})();

// ЗВУК
function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    const presets = {
      classic: {freq:[880, 1100], dur:0.15, type:'sine'},
      cat:     {freq:[600, 900],  dur:0.3,  type:'sawtooth'},
      bit:     {freq:[400, 800],  dur:0.08, type:'square'},
      bowl:    {freq:[220, 330],  dur:1.2,  type:'sine'},
      rocket:  {freq:[200, 1200], dur:0.4,  type:'sawtooth'},
      coin:    {freq:[1200, 1600],dur:0.1,  type:'triangle'},
    };
    const p = presets[type] || presets.classic;
    osc.type = p.type;
    osc.frequency.setValueAtTime(p.freq[0], ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(p.freq[1], ctx.currentTime + p.dur);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + p.dur);
    osc.start(); osc.stop(ctx.currentTime + p.dur);
  } catch(e) {}
}

function generateDailyQuests(){const s=storage.get();const t1=QUEST_POOL.filter(q=>q.tier===1);const t2=QUEST_POOL.filter(q=>q.tier===2);const t3=QUEST_POOL.filter(q=>q.tier===3);const pick=arr=>arr[Math.floor(Math.random()*arr.length)];s.daily.quests=[{...pick(t1),progress:0,claimed:false},{...pick(t2),progress:0,claimed:false},{...pick(t3),progress:0,claimed:false}];s.daily.date=todayStr();s.daily.startCoins=s.wallet.coins;storage.save()}

function checkQuests(){
  if(_inCheck)return;
  _inCheck=true;
  const s=storage.get();
  const todaySessions=s.sessions.filter(x=>x.date===todayStr());
  const todayHabits=new Set(todaySessions.map(x=>x.habitId)).size;
  const maxStreak=Math.max(...habits.list().map(h=>analytics.getStreak(h.id)),0);
  s.daily.quests.forEach(q=>{
    if(q.claimed)return;
    if(q.type==='pomo')q.progress=todaySessions.length;
    else if(q.type==='habit')q.progress=todayHabits;
    else if(q.type==='earn')q.progress=Math.max(0,s.wallet.coins-(s.daily.startCoins||0));
    else if(q.type==='streak')q.progress=todaySessions.length>0?maxStreak:0;
  });
  _inCheck=false;
  storage.saveSilent();
}

function placeBid(amount) {
  const s = storage.get();

  if (amount <= s.wallet.auctionFakeBid) return ui.showToast('Ставка должна быть выше');

  s.wallet.auctionMyBid = amount;
  s.wallet.auctionFakeBid = amount + 50 + Math.floor(Math.random() * 200);
  storage.save();
  ui.showToast(`🎯 Ставка ${amount} принята!`);

}

window.buyItem = function(id, price) {
  const item = ALL_SHOP_ITEMS.find(i => i.id === id);
  if (!item) return;
  const s = storage.get();
  if (item.type === 'vip' && s.settings.isVip) return ui.showToast('VIP уже куплен!');
  if (wallet.spend(price)) {
    const w = s.wallet;
    if (item.type === 'theme') {
      if (!w.unlocked.themes.includes(item.payload)) w.unlocked.themes.push(item.payload);
      s.settings.activeTheme = item.payload;
      document.documentElement.dataset.theme = item.payload;
      ui.showToast(`Куплено и применено: ${item.name}`);
    } else if (item.type === 'consumable') {
      w.inventory[item.payload] = (w.inventory[item.payload]||0) + 1;
      ui.showToast(`Куплено: ${item.name}`);
    } else if (item.type === 'effect') {
      w.doubleUntil = Date.now() + (item.payload === 'triple' ? 1800000 : 3600000);
      ui.showToast(`Активирован эффект: ${item.name}`);
    } else if (item.type === 'skin') {
      if (!w.unlocked.skins.includes(item.payload)) w.unlocked.skins.push(item.payload);
      s.settings.activeSkin = item.payload;
      applySkin(item.payload);
      ui.showToast(`Скин применён: ${item.name}`);
    } else if (item.type === 'sound') {
      if (!w.unlocked.sounds.includes(item.payload)) w.unlocked.sounds.push(item.payload);
      s.settings.activeSound = item.payload;
      ui.showToast(`Звук выбран: ${item.name}`);
    } else if (item.type === 'frame') {
      if (!w.unlocked.frames.includes(item.payload)) w.unlocked.frames.push(item.payload);
      s.settings.activeFrame = item.payload;
      applyFrame(item.payload);
      ui.showToast(`Рамка применена: ${item.name}`);
    } else if (item.type === 'lootbox') {
      const win = Math.random();
      if (win < 0.05) { wallet.earn(500); ui.showToast('🎉 ДЖЕКПОТ! 500 монет!'); }
      else if (win < 0.25) { w.inventory.freeze = (w.inventory.freeze || 0) + 1; ui.showToast('🎉 Выпала заморозка!'); }
      else if (win < 0.6) { wallet.earn(100); ui.showToast('🎉 100 монет!'); }
      else { ui.showToast('😢 Пусто...'); }
    } else if (item.type === 'vip') {
      s.settings.isVip = true;
      THEMES.forEach(t => { if (!w.unlocked.themes.includes(t.payload)) w.unlocked.themes.push(t.payload); });
      ui.showToast('👑 VIP! Все темы открыты в магазине.');
    }
    storage.save();
    haptic('success');
    updateShop();
  }
};

class PomodoroTimer{
constructor(){const ts=storage.get().timerState;this.phase=ts.phase||'focus';this.running=false;this.remaining=ts.remaining||this._cfg()[this.phase];this.endTime=0;this.habitId=ts.habitId||null;this.focusCount=ts.focusCount||0;this.startDuration=0;this.interval=null;if(ts.running&&ts.endTime>Date.now()){this.remaining=Math.round((ts.endTime-Date.now())/1000);this.start(this.habitId,true)}this.onTick(this.remaining,this.phase)}
_cfg(){const s=storage.get().settings;return{focus:s.pomodoroMin*60,shortBreak:s.shortBreakMin*60,longBreak:s.longBreakMin*60}}
_saveState(){const s=storage.get();s.timerState={running:this.running,phase:this.phase,endTime:this.endTime,habitId:this.habitId,remaining:this.remaining,focusCount:this.focusCount};storage.save()}
_setPhase(phase){this.phase=phase;this.remaining=this._cfg()[phase];this.endTime=0;this._saveState();this.onTick(this.remaining,this.phase)}
start(habitId,isRestore=false){if(this.running)return;if(habitId)this.habitId=habitId;if(this.remaining<=0)this._setPhase(this.phase);if(!isRestore){this.endTime=Date.now()+this.remaining*1000;this.startDuration=storage.get().settings.pomodoroMin;}this.running=true;this._saveState();this.interval=setInterval(()=>this._tick(),250);this._tick()}
pause(){if(!this.running)return;this.remaining=Math.max(0,Math.round((this.endTime-Date.now())/1000));this.running=false;clearInterval(this.interval);this._saveState();this.onTick(this.remaining,this.phase)}
skip(){this.pause();this._setPhase(this.phase==='focus'?'shortBreak':'focus')}
_tick(){
  const left=Math.max(0,Math.round((this.endTime-Date.now())/1000));
  this.remaining=left;
  this.onTick(left,this.phase);
  if(left<=0){
    clearInterval(this.interval);
    this.running=false;
    if(this.phase==='focus'&&this.habitId){
      habits.addSession(this.habitId,this.startDuration||storage.get().settings.pomodoroMin);
      wallet.earn(10);
      this.focusCount++;
    }
    const nextPhase=this.phase==='focus'?(this.focusCount>0&&this.focusCount%4===0?'longBreak':'shortBreak'):'focus';
    this._setPhase(nextPhase);
    document.getElementById('startBtn').hidden=false;
    document.getElementById('pauseBtn').hidden=true;
    playSound(storage.get().settings.activeSound || 'classic');
  }
}
onTick(remaining,phase){const el=document.getElementById('timerTime');if(!el)return;el.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;document.getElementById('timerPhase').textContent=phase;const ring=document.getElementById('ringFg');if(ring){const cfg=this._cfg()[phase];ring.style.strokeDashoffset=339.292*(1-(remaining/cfg))}document.title=remaining>0?`⏱ ${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')} · FocusFlow`:'FocusFlow'}
}

document.getElementById('saveSettingsBtn').addEventListener('click',()=>{const s=storage.get();s.settings.pomodoroMin=Math.max(1,+document.getElementById('sPomo').value);s.settings.shortBreakMin=Math.max(0.1,+document.getElementById('sShort').value);s.settings.longBreakMin=Math.max(1,+document.getElementById('sLong').value);storage.save();if(!timer.running){timer._setPhase(timer.phase);document.getElementById('startBtn').hidden=false;document.getElementById('pauseBtn').hidden=true;}document.getElementById('settingsModal').classList.remove('open')});
document.getElementById('closeSettingsBtn').addEventListener('click',()=>document.getElementById('settingsModal').classList.remove('open'));
document.getElementById('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(storage.get(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`focusflow-${todayStr()}.json`;a.click()});
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',(e)=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=(event)=>{try{const parsed=JSON.parse(event.target.result);if(parsed.habits){storage.get().habits=parsed.habits;storage.get().settings=parsed.settings||storage.get().settings;storage.get().wallet=parsed.wallet||storage.get().wallet;storage.get().sessions=parsed.sessions||[];storage.save();ui.showToast('Импорт успешен!')}else{ui.showToast('Неверный файл')}}catch(err){ui.showToast('Ошибка чтения')}};reader.readAsText(file)});

// СТАТИСТИКА
document.getElementById('statsBtn').addEventListener('click',()=>{const s=analytics.getStats();const maxCount=Math.max(...Object.values(s.week),1);let chartHTML='<div style="display:flex;align-items:flex-end;justify-content:space-between;height:120px;margin-top:20px;padding-bottom:10px;border-bottom:1px solid var(--border);">';Object.entries(s.week).forEach(([date,count])=>{const dayName=date.slice(8);const height=(count/maxCount)*100;const color=count>0?'var(--accent)':'var(--surface)';chartHTML+=`<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;"><div style="font-size:0.7rem;color:var(--text-muted);font-weight:600;">${count>0?count:''}</div><div style="width:100%;max-width:24px;height:${Math.max(height,5)}%;background:${color};border-radius:6px 6px 0 0;transition:height 0.3s;"></div><div style="font-size:0.7rem;color:var(--text-muted);">${dayName}</div></div>`});chartHTML+='</div>';document.getElementById('statsContent').innerHTML=`<div style="display:flex;gap:10px;justify-content:center;margin-bottom:20px;"><div style="background:var(--surface);padding:12px;border-radius:12px;flex:1;text-align:center;border:1px solid var(--border);"><div style="font-size:1.5rem;font-weight:800;color:var(--accent);">${s.total}</div><div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Всего</div></div><div style="background:var(--surface);padding:12px;border-radius:12px;flex:1;text-align:center;border:1px solid var(--border);"><div style="font-size:1.5rem;font-weight:800;color:var(--accent-2);">${(s.min/60).toFixed(1)}</div><div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Часов</div></div></div><h4 style="font-size:0.9rem;margin-bottom:4px;text-align:center;color:var(--text-muted);">Активность за 7 дней</h4>${chartHTML}<p style="font-size:0.75rem;color:var(--text-muted);margin-top:15px;text-align:center;">Каждый столбик — количество помидоров в день</p>`;document.getElementById('statsModal').classList.add('open')});
document.getElementById('closeStatsBtn').addEventListener('click',()=>document.getElementById('statsModal').classList.remove('open'));

// КОЛЕСО
document.getElementById('wheelBtn').addEventListener('click',()=>{const s=storage.get();const btn=document.getElementById('spinBtn');if(s.wallet.spinDate === todayStr() && !s.settings.isDev){btn.textContent='Завтра!'}else{btn.textContent='Крутить'}document.getElementById('wheelModal').classList.add('open')});
document.getElementById('spinBtn').addEventListener('click',()=>{const s=storage.get();if(s.wallet.spinDate === todayStr() && !s.settings.isDev)return ui.showToast('Уже крутил сегодня! Приходи завтра 🎡');const wheel=document.getElementById('wheel');const btn=document.getElementById('spinBtn');btn.style.pointerEvents='none';btn.textContent='...';s.wallet.spinDate=todayStr();storage.save();haptic('impact');const winIndex=Math.floor(Math.random()*8);const targetAngle=1800+(winIndex*45)+22.5;wheel.style.transform=`rotate(${targetAngle}deg)`;setTimeout(()=>{const win=winIndex===0?50:winIndex===1?0:winIndex===2?1:winIndex===3?10:winIndex===4?100:winIndex===5?0:winIndex===6?20:2;if(win===1){s.wallet.inventory.freeze=(s.wallet.inventory.freeze||0)+1;storage.save();ui.showToast('🎉 Заморозка!')}else if(win===2){s.wallet.doubleUntil=Date.now()+3600000;storage.save();ui.showToast('🎉 x2 монеты на час!')}else if(win===0){ui.showToast('😢 Пусто')}else{wallet.earn(win);ui.showToast(`🎉 +${win} 🪙`)}haptic('success');wheel.style.transition='none';wheel.style.transform='rotate(0deg)';setTimeout(()=>{wheel.style.transition='transform 4s cubic-bezier(0.15, 0.85, 0.25, 1)'},50);btn.style.pointerEvents='auto';btn.textContent='Завтра!';updateShop();},4000)});
document.getElementById('closeWheelBtn').addEventListener('click',()=>document.getElementById('wheelModal').classList.remove('open'));

// АВТОСМЕНА ДНЯ
setInterval(() => {
  const s = storage.get();
  if (s.daily.date !== todayStr()) {
    generateDailyQuests();
    s.wallet.freeClaimedDate = '';
    s.wallet.spinDate = '';
    storage.save();
    initShop();
    const qm = document.getElementById('questsModal');
    if (qm && qm.classList.contains('open')) renderQuests();
  }
}, 60000);

// ТЕМА
document.documentElement.dataset.theme=storage.get().settings.activeTheme||'dark';
if (storage.get().settings.activeSkin) applySkin(storage.get().settings.activeSkin);
if (storage.get().settings.activeFrame) applyFrame(storage.get().settings.activeFrame);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-backdrop.open').forEach(m => m.classList.remove('open'));
});
document.getElementById('hName').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('saveHabitBtn').click(); });
document.getElementById('promoInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('applyPromoBtn').click(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && timer.running) timer._tick(); });
</script>
</body>
  </html>
